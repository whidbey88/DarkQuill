<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9f6fbf"/>
      <stop offset="100%" stop-color="#1a0033"/>
    </linearGradient>
  </defs>

  <!-- Purple background rounded square -->
  <rect x="16" y="16" width="480" height="480" rx="96" ry="96" fill="url(#bgGrad)"/>

  <!-- Pencil icon - thick and bold for small size readability -->
  <!-- Pencil body (rotated ~45 degrees, drawn as a path) -->
  <g transform="translate(256, 256) rotate(-45) translate(-256, -256)">
    <!-- Pencil shaft -->
    <rect x="206" y="80" width="100" height="300" rx="8" ry="8" fill="#fcf8fe"/>

    <!-- Pencil tip (triangle) -->
    <polygon points="206,380 306,380 256,440" fill="#fcf8fe"/>

    <!-- Tip point (dark) -->
    <polygon points="236,410 276,410 256,440" fill="#1a0033"/>

    <!-- Eraser band -->
    <rect x="206" y="80" width="100" height="40" rx="8" ry="0" fill="#dbb8ff"/>

    <!-- Pencil line detail -->
    <line x1="256" y1="120" x2="256" y2="380" stroke="#c799ff" stroke-width="4" opacity="0.4"/>
  </g>
</svg>
